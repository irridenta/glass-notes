<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; script-src 'self'">
  <title>Glass Notes</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="aurora" aria-hidden="true">
    <span class="orb orb-a"></span><span class="orb orb-b"></span><span class="orb orb-c"></span>
    <div class="grain"></div>
  </div>

  <div class="app" id="app">
    <aside class="sidebar glass" id="sidebar">
      <div class="side-top drag">
        <div class="brand no-drag">
          <span class="brand-mark" aria-hidden="true"></span>
          <span class="brand-name">Glass Notes</span>
        </div>
        <button class="icon-btn no-drag" id="collapseSide" title="Hide sidebar (Ctrl+\)">
          <svg viewBox="0 0 20 20"><path d="M12.5 5 7.5 10l5 5"/></svg>
        </button>
      </div>

      <div class="side-actions">
        <button class="side-item" id="openSearch">
          <svg viewBox="0 0 20 20"><circle cx="9" cy="9" r="5.5"/><path d="m13.2 13.2 3.3 3.3"/></svg>
          <span>Search</span><kbd>Ctrl K</kbd>
        </button>
        <button class="side-item" id="goHome">
          <svg viewBox="0 0 20 20"><path d="M3.5 9 10 3.5 16.5 9v7a1 1 0 0 1-1 1h-3.5v-4.5h-4V17H4.5a1 1 0 0 1-1-1z"/></svg>
          <span>Home</span>
        </button>
        <button class="side-item" id="newPage">
          <svg viewBox="0 0 20 20"><path d="M10 4.5v11M4.5 10h11"/></svg>
          <span>New page</span><kbd>Ctrl N</kbd>
        </button>
      </div>

      <div class="side-scroll" id="sideScroll">
        <div class="side-section" id="favSection">
          <div class="side-label">Favorites</div>
          <div class="tree" id="favTree"></div>
        </div>
        <div class="side-section">
          <div class="side-label">
            <span>Pages</span>
            <button class="mini-btn" id="addRootPage" title="Add a page">
              <svg viewBox="0 0 20 20"><path d="M10 5v10M5 10h10"/></svg>
            </button>
          </div>
          <div class="tree" id="pageTree"></div>
        </div>
      </div>

      <div class="side-bottom">
        <button class="side-item" id="openTemplates">
          <svg viewBox="0 0 20 20"><rect x="3.5" y="3.5" width="5.5" height="5.5" rx="1.2"/><rect x="11" y="3.5" width="5.5" height="5.5" rx="1.2"/><rect x="3.5" y="11" width="5.5" height="5.5" rx="1.2"/><rect x="11" y="11" width="5.5" height="5.5" rx="1.2"/></svg>
          <span>Templates</span>
        </button>
        <button class="side-item" id="openTrash">
          <svg viewBox="0 0 20 20"><path d="M4 6h12M8 6V4.5h4V6M5.5 6l.8 10h7.4l.8-10"/></svg>
          <span>Trash</span><span class="count" id="trashCount"></span>
        </button>
        <button class="side-item" id="openSettings">
          <svg viewBox="0 0 20 20"><circle cx="10" cy="10" r="2.5"/><path d="M10 2.8v2M10 15.2v2M2.8 10h2M15.2 10h2M4.9 4.9l1.4 1.4M13.7 13.7l1.4 1.4M4.9 15.1l1.4-1.4M13.7 6.3l1.4-1.4"/></svg>
          <span>Settings</span>
        </button>
      </div>
    </aside>

    <main class="main" id="main">
      <header class="topbar drag" id="topbar">
        <button class="icon-btn no-drag show-side" id="expandSide" title="Show sidebar (Ctrl+\)">
          <svg viewBox="0 0 20 20"><path d="M3.5 5.5h13M3.5 10h13M3.5 14.5h13"/></svg>
        </button>
        <nav class="crumbs no-drag" id="crumbs"></nav>
        <div class="top-actions no-drag" id="topActions">
          <span class="save-state" id="saveState"></span>
          <button class="ghost-btn" id="shareBtn">
            <svg viewBox="0 0 20 20"><path d="M10 12.5V3.5M6.5 7 10 3.5 13.5 7M4.5 11v4.5a1 1 0 0 0 1 1h9a1 1 0 0 0 1-1V11"/></svg>
            Share
          </button>
          <button class="icon-btn" id="favBtn" title="Add to favorites">
            <svg viewBox="0 0 20 20"><path d="m10 3.3 2 4.2 4.6.6-3.4 3.2.9 4.6L10 13.6l-4.1 2.3.9-4.6-3.4-3.2 4.6-.6z"/></svg>
          </button>
          <button class="icon-btn" id="moreBtn" title="Page options">
            <svg viewBox="0 0 20 20"><circle cx="5" cy="10" r="1.2" class="fill"/><circle cx="10" cy="10" r="1.2" class="fill"/><circle cx="15" cy="10" r="1.2" class="fill"/></svg>
          </button>
        </div>
      </header>
      <div class="scroller" id="scroller">
        <div id="view"></div>
      </div>
    </main>
  </div>

  <div id="layer"></div>
  <div class="toast-wrap" id="toasts"></div>

  <script src="content.js"></script>
  <script src="export.js"></script>
  <script src="ui.js"></script>
  <script src="editor.js"></script>
  <script src="app.js"></script>
</body>
</html>
